[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "creditlake"
version = "1.1.0"
description = "Auditable SEC financial data pipelines with historical analytics"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "duckdb==1.4.4",
  "dbt-duckdb==1.10.1",
  "dbt-core==1.12.5",
  "fastapi==0.128.0",
  "uvicorn==0.40.0",
  "filelock==3.20.3",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "httpx==0.28.1", "ruff==0.14.14"]

[project.scripts]
creditlake = "creditlake.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
creditlake = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
