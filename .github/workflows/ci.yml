name: Verify CreditLake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validated dependencies
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
      - name: Run behavioral and integration tests
        run: pytest --junitxml=validation/pytest.xml
      - name: Reproduce replay, trace, and recovery demonstration
        run: python scripts/verify_portfolio.py --output validation/portfolio-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: validation/
          retention-days: 14

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the pipeline and API
        run: docker compose up --build --wait --wait-timeout 180 api
      - name: Verify the serving container
        run: python scripts/container_smoke.py
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
