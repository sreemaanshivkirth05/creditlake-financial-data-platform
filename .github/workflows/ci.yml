name: Verify CreditLake

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install validated dependencies
        run: python -m pip install -c requirements.lock.txt -e '.[dev]'
      - name: Check code
        run: |
          ruff check .
          ruff format --check .
      - name: Run behavioral and integration tests
        run: pytest --junitxml=validation/pytest.xml
      - name: Reproduce replay, trace, and recovery demonstration
        run: python scripts/verify_portfolio.py --output validation/portfolio-validation.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: validation-python-${{ matrix.python }}
          path: validation/
          retention-days: 14

  container:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build and start the pipeline and API
        run: docker compose up --build --wait --wait-timeout 180 api
      - name: Verify the serving container
        run: python scripts/container_smoke.py
      - name: Show container logs
        if: always()
        run: docker compose logs --no-color
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
